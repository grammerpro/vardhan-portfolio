<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>ANON Dapp</title><desc>SOURCE-BASED DIAGRAM / Experimental vault. Local ledger and shard animation are simulations.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#30383d" stroke-width=".5"/></pattern></defs><rect width="1200" height="720" fill="#111619"/><rect x="40" y="40" width="1120" height="640" fill="url(#grid)" opacity=".55"/><text x="66" y="89" font-family="Arial, sans-serif" font-size="13" fill="#a7c7b5" letter-spacing="2">VARDHAN / INSIDE THE SYSTEM</text><text x="66" y="159" font-family="Arial, sans-serif" font-size="47" fill="#f4f1ea" >ANON Dapp</text><text x="68" y="201" font-family="Arial, sans-serif" font-size="17" fill="#bec6cb" >Follow the file across browser boundaries.</text><rect x="70" y="291" width="250" height="116" rx="4" fill="#20262b" stroke="#53616b"/><rect x="70" y="291" width="3" height="116" fill="#a7c7b5"/><text x="94" y="334" font-family="Arial, sans-serif" font-size="23" fill="#f4f1ea" >File → Web Crypto</text><text x="94" y="368" font-family="Arial, sans-serif" font-size="14" fill="#bec6cb" >AES-GCM encrypted bytes</text><path d="M320 349L400 349" fill="none" stroke="#a7c7b5" stroke-width="2"/><rect x="400" y="261" width="335" height="116" rx="4" fill="#20262b" stroke="#53616b"/><rect x="400" y="261" width="3" height="116" fill="#a7c7b5"/><text x="424" y="304" font-family="Arial, sans-serif" font-size="23" fill="#f4f1ea" >Local IndexedDB</text><text x="424" y="338" font-family="Arial, sans-serif" font-size="14" fill="#bec6cb" >Ciphertext + exported key stored</text><rect x="400" y="422" width="335" height="116" rx="4" fill="#20262b" stroke="#53616b"/><rect x="400" y="422" width="3" height="116" fill="#a7c7b5"/><text x="424" y="465" font-family="Arial, sans-serif" font-size="23" fill="#f4f1ea" >Optional Pinata</text><text x="424" y="499" font-family="Arial, sans-serif" font-size="14" fill="#bec6cb" >Remote upload with configured token</text><path d="M358 349L358 480" fill="none" stroke="#a7c7b5" stroke-width="2"/><path d="M358 480L400 480" fill="none" stroke="#a7c7b5" stroke-width="2"/><path d="M735 319L790 319" fill="none" stroke="#76838b" stroke-width="2"/><path d="M790 319L790 400" fill="none" stroke="#76838b" stroke-width="2"/><path d="M735 480L790 480" fill="none" stroke="#76838b" stroke-width="2"/><path d="M790 480L790 400" fill="none" stroke="#76838b" stroke-width="2"/><path d="M790 400L830 400" fill="none" stroke="#76838b" stroke-width="2"/><rect x="830" y="342" width="300" height="116" rx="4" fill="#20262b" stroke="#53616b"/><rect x="830" y="342" width="3" height="116" fill="#a7c7b5"/><text x="854" y="385" font-family="Arial, sans-serif" font-size="23" fill="#f4f1ea" >Share → decrypt</text><text x="854" y="419" font-family="Arial, sans-serif" font-size="14" fill="#bec6cb" >Credentials in URL fragment</text><path d="M66 631L1134 631" fill="none" stroke="#414c53" stroke-width="2"/><text x="66" y="665" font-family="Arial, sans-serif" font-size="13" fill="#b7c0c6" >SOURCE-BASED DIAGRAM / Experimental vault. Local ledger and shard animation are simulations.</text></svg>