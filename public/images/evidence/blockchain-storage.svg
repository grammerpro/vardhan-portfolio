<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>Blockchain Storage</title><desc>SOURCE-BASED DIAGRAM / Flask + Python. Network replication and confidentiality are not established.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#30383d" stroke-width=".5"/></pattern></defs><rect width="1200" height="720" fill="#111619"/><rect x="40" y="40" width="1120" height="640" fill="url(#grid)" opacity=".55"/><text x="66" y="89" font-family="Arial, sans-serif" font-size="13" fill="#b5c2bd" letter-spacing="2">VARDHAN / INSIDE THE SYSTEM</text><text x="66" y="159" font-family="Arial, sans-serif" font-size="47" fill="#f4f1ea" >Blockchain Storage</text><text x="68" y="201" font-family="Arial, sans-serif" font-size="17" fill="#bec6cb" >File handling and proof of work, made inspectable.</text><rect x="70" y="301" width="280" height="116" rx="4" fill="#20262b" stroke="#53616b"/><rect x="70" y="301" width="3" height="116" fill="#b5c2bd"/><text x="94" y="344" font-family="Arial, sans-serif" font-size="23" fill="#f4f1ea" >Flask upload</text><text x="94" y="378" font-family="Arial, sans-serif" font-size="14" fill="#bec6cb" >File saved to local directory</text><path d="M350 359L405 359" fill="none" stroke="#b5c2bd" stroke-width="2"/><rect x="405" y="301" width="330" height="116" rx="4" fill="#20262b" stroke="#53616b"/><rect x="405" y="301" width="3" height="116" fill="#b5c2bd"/><text x="429" y="344" font-family="Arial, sans-serif" font-size="23" fill="#f4f1ea" >Pending transaction</text><text x="429" y="378" font-family="Arial, sans-serif" font-size="14" fill="#bec6cb" >Metadata sent to local peer</text><path d="M735 359L790 359" fill="none" stroke="#b5c2bd" stroke-width="2"/><rect x="790" y="301" width="340" height="116" rx="4" fill="#20262b" stroke="#53616b"/><rect x="790" y="301" width="3" height="116" fill="#b5c2bd"/><text x="814" y="344" font-family="Arial, sans-serif" font-size="23" fill="#f4f1ea" >Python chain</text><text x="814" y="378" font-family="Arial, sans-serif" font-size="14" fill="#bec6cb" >SHA-256 + nonce search</text><text x="405" y="495" font-family="Arial, sans-serif" font-size="27" fill="#f4f1ea" >Previous hash → block → next hash</text><text x="405" y="537" font-family="Arial, sans-serif" font-size="17" fill="#bec6cb" >A custom chain experiment, with local file storage.</text><path d="M66 631L1134 631" fill="none" stroke="#414c53" stroke-width="2"/><text x="66" y="665" font-family="Arial, sans-serif" font-size="13" fill="#b7c0c6" >SOURCE-BASED DIAGRAM / Flask + Python. Network replication and confidentiality are not established.</text></svg>