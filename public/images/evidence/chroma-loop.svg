<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><title>Chroma Loop</title><desc>SOURCE-BASED GAMEPLAY ILLUSTRATION / TypeScript + Canvas 2D. No simulated score or frame-rate claim.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#30383d" stroke-width=".5"/></pattern></defs><rect width="1200" height="720" fill="#111619"/><rect x="40" y="40" width="1120" height="640" fill="url(#grid)" opacity=".55"/><text x="66" y="89" font-family="Arial, sans-serif" font-size="13" fill="#c5a0ec" letter-spacing="2">VARDHAN / INSIDE THE SYSTEM</text><text x="66" y="159" font-family="Arial, sans-serif" font-size="47" fill="#f4f1ea" >Chroma Loop</text><text x="68" y="201" font-family="Arial, sans-serif" font-size="17" fill="#bec6cb" >A small input loop. A repeatable game system.</text><g transform="translate(345 423)"><circle r="136" fill="none" stroke="#343c43" stroke-width="60"/><circle r="136" fill="none" stroke="#a899df" stroke-width="59" stroke-dasharray="209 646" transform="rotate(-87)"/><circle r="136" fill="none" stroke="#eab178" stroke-width="59" stroke-dasharray="209 646" transform="rotate(3)"/><circle r="136" fill="none" stroke="#8ebfc5" stroke-width="59" stroke-dasharray="209 646" transform="rotate(93)"/><circle r="136" fill="none" stroke="#b8cda5" stroke-width="59" stroke-dasharray="209 646" transform="rotate(183)"/><circle r="78" fill="none" stroke="#68717a"/><text x="-38" y="7" font-family="Arial, sans-serif" font-size="15" fill="#f4f1ea" >ROTATE</text><circle cx="0" cy="-84" r="12" fill="#8ebfc5"/><path d="M0 -175V-120" stroke="#8ebfc5" stroke-dasharray="4 6"/></g><rect x="650" y="275" width="440" height="116" rx="4" fill="#20262b" stroke="#53616b"/><rect x="650" y="275" width="3" height="116" fill="#c5a0ec"/><text x="674" y="318" font-family="Arial, sans-serif" font-size="23" fill="#f4f1ea" >Keyboard / pointer</text><text x="674" y="352" font-f